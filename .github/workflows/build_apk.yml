name: Build APK

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install protoc and plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          dart pub global activate protoc_plugin 21.1.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install NDK and gomobile
        run: |
          sdkmanager "ndk;25.2.9519653"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/bind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 关键：预创建 gomobile 期望的 NDK 目录结构
      # gomobile init 下载 NDK 到 $GOPATH/pkg/gomobile/android-ndk/<version>/
      # 我们把 sdkmanager 的 NDK 软链接过去
      - name: Trick gomobile into using existing NDK
        run: |
          GOMOBILE_NDK="$HOME/gomobile-ndk"
          NDK_VER="r25c"
          mkdir -p "$GOMOBILE_NDK/$NDK_VER"
          # sdkmanager 的 NDK 路径
          SDK_NDK="$ANDROID_HOME/ndk/25.2.9519653"
          # 创建符号链接，让 gomobile 认为 NDK 已下载
          ln -sf "$SDK_NDK" "$GOMOBILE_NDK/$NDK_VER/ndk"
          # 也创建 gomobile 期望的路径
          GOPATH_GOMOBILE="$(go env GOPATH)/pkg/gomobile/android-ndk"
          mkdir -p "$GOPATH_GOMOBILE/$NDK_VER"
          ln -sf "$SDK_NDK" "$GOPATH_GOMOBILE/$NDK_VER/ndk"
          echo "GOMOBILE_NDK=$GOMOBILE_NDK" >> $GITHUB_ENV

      - name: Init gomobile
        run: |
          export GOMOBILE_NDK=$GOMOBILE_NDK
          gomobile init -v 2>&1 || echo "WARNING: gomobile init failed, will try direct bind"

      - name: Generate protobuf code
        run: make protobuf

      - name: Build server AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          make server-aar

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pho-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
