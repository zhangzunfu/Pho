name: Build APK

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install protoc and plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          dart pub global activate protoc_plugin 21.1.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Android NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Generate protobuf code
        run: make protobuf

      # gomobile init 会下载 NDK 到 $GOPATH/pkg/gomobile/
      # 预先创建该目录并放一个标记文件，让 gomobile 认为 NDK 已存在
      - name: Pre-populate gomobile NDK cache
        run: |
          GOMOBILE_DIR="$(go env GOPATH)/pkg/gomobile"
          mkdir -p "$GOMOBILE_DIR"
          NDK_DIR="$GOMOBILE_DIR/android-ndk"
          mkdir -p "$NDK_DIR"
          # 将 sdkmanager 安装的 NDK 软链接过去
          ln -sf "$ANDROID_HOME/ndk/25.2.9519653" "$NDK_DIR/25.2.9519653"
          # 创建标记文件让 gomobile 跳过下载
          touch "$NDK_DIR/.gomobile-initialized"
          echo "Gomobile NDK cache prepared at $GOMOBILE_DIR"
          ls -la "$NDK_DIR/"

      - name: Install gomobile and init
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/bind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          gomobile init -v 2>&1 || echo "gomobile init warning (may be ok)"

      - name: Build server AAR
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          gomobile bind -target=android -androidapi 21 -ldflags "-s -w" -o android/app/libs/server.aar ./server/run

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pho-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
