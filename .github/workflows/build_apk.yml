name: Build APK

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ========== 环境 ==========

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install protoc and Go plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.27.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # ========== 安装 NDK ==========

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ 2>/dev/null || echo "ANDROID_HOME not found"
          sdkmanager --list 2>/dev/null | head -5
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ========== 安装 gomobile ==========

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/bind@latest
          gomobile init

      # ========== 构建 Go 服务端 AAR ==========

      - name: Build server AAR
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" 2>/dev/null || echo "NDK dir not found"
          make server-aar

      # ========== 构建 Flutter APK ==========

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      # ========== 上传产物 ==========

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pho-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
